# picom: shadows, fades, corners and open/close animations; windows stay solid

shadow = true;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

corner-radius = 0;

animations = (
  { triggers = ["open", "show"];  preset = "appear";          duration = 0.20; },
  { triggers = ["close", "hide"]; preset = "disappear";       duration = 0.20; },
  { triggers = ["geometry"];      preset = "geometry-change"; duration = 0.30; }
);

# xrender works everywhere (VMs, software rendering); on NVIDIA's driver,
# if the mouse lags or vsync breaks, try "glx"
backend = "xrender";
vsync = true;
detect-rounded-corners = false;
detect-transient = true;

rules: ({
  # the bar, notifications and GTK's own frames draw their own edges
  match = "window_type = 'dock' || window_type = 'dnd' || name = 'Notification' || "
          "class_g ?= 'Notify-osd' || _GTK_FRAME_EXTENTS@";
  shadow = false;
}, {
  match = "window_type = 'dock' || window_type = 'desktop'";
  corner-radius = 0;
}, {
  # menus and tooltips appear at once
  match = "window_type = 'popup_menu' || window_type = 'dropdown_menu' || "
          "window_type = 'tooltip' || window_type = 'dialog'";
  fade = false;
  animations = false;
})
