[module/keyboard]
type = custom/script
exec = setxkbmap -query | grep layout | awk '{print toupper($2)}'
interval = 1
click-left = ~/.config/polybar/scripts/layout-switch.sh
label = ⌨ %output%
[module/xwindow-icon]
type = custom/script
exec = ~/.config/polybar/scripts/xwindow-icon.sh
tail = true
format-padding = 1