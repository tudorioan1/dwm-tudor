[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false

; Interval for volume increase/decrease (in percent points)
interval = 5

; Available tags: <label-volume>, <ramp-volume>, <bar-volume>
format-volume = <bar-volume> <label-volume>
format-volume-padding = 2px

; Available tags: <label-muted>, <ramp-volume>, <bar-volume>
format-muted = <label-muted>
format-muted-padding = 2px

label-volume = %{T2}%percentage%%%{T-}
label-volume-padding = 0

; Muted label
label-muted = Muted (0%)
label-muted-foreground = ${colors.fg-alt}

; Volume bar settings
bar-volume-width = 10
bar-volume-foreground-0 = ${colors.vol-0:#ff5555}
bar-volume-foreground-1 = ${colors.vol-1:#ff7755}
bar-volume-foreground-2 = ${colors.vol-2:#ff9955}
bar-volume-foreground-3 = ${colors.vol-3:#ffbb55}
bar-volume-foreground-4 = ${colors.vol-4:#ffdd55}
bar-volume-foreground-5 = ${colors.vol-5:#ddff55}
bar-volume-foreground-6 = ${colors.vol-6:#bbff55}
bar-volume-foreground-7 = ${colors.vol-7:#99ff55}
bar-volume-foreground-8 = ${colors.vol-8:#77ff55}
bar-volume-foreground-9 = ${colors.vol-9:#55ff55}
bar-volume-gradient = true
bar-volume-indicator = |
bar-volume-indicator-font = 2
bar-volume-fill = ─
bar-volume-fill-font = 2
bar-volume-empty = ─
bar-volume-empty-font = 2
bar-volume-empty-foreground = ${colors.fg-alt}

; Right click to open pavucontrol
click-right = pavucontrol&
