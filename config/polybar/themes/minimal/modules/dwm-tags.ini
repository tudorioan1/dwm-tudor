[module/dwm-tags]
type = custom/script
exec = $HOME/.config/polybar/scripts/dwm-tags.sh --tail
tail = true

; Format
format = <label>
format-foreground = ${colors.fg}
format-background = ${colors.bg}
format-padding = 1

label = %output%

; Tag colours follow the active theme (dwm-tags.sh reads them from colors.ini: active = accent,
; occupied = fg, empty = fg-alt, urgent = red). To force a colour, set one of these here:
;env-DWM_TAG_ACTIVE_COLOR = #ffffff
;env-DWM_TAG_OCCUPIED_COLOR = #cccccc
;env-DWM_TAG_EMPTY_COLOR = #777777
;env-DWM_TAG_URGENT_COLOR = #cc3333

; Font customization: (check fonts.ini for available fonts)
; Font index for active tags
env-DWM_TAG_ACTIVE_FONT = 3
; Font index for occupied tags
env-DWM_TAG_OCCUPIED_FONT = 3
; Font index for urgent tags
env-DWM_TAG_URGENT_FONT = 3

; Features:
; - Active tags: Shows currently selected tag (bright)
; - Occupied tags: Shows tags with windows (dimmer)
; - Urgent tags: Shows tags with urgent windows (red)
; - Empty tags: Hidden automatically
; - Works across all monitors

; Font index for empty tags (normal weight)
env-DWM_TAG_EMPTY_FONT = 1
; How many tags to always display
env-DWM_TAG_COUNT = 5
